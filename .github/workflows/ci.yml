name: ci
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # 공개 트리는 lockfile 없이 만든다. cache: pnpm은 lockfile이 없으면 실패한다.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
